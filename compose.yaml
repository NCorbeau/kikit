services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: kikit
      POSTGRES_PASSWORD: kikit_local_only
      POSTGRES_DB: kikit
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - kikit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kikit -d kikit']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  kikit-postgres:
